name: Build MAMANG ANTER APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MAMANG_ANTER_XIAOMI_ANDROID13.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip MAMANG_ANTER_XIAOMI_ANDROID13.zip

      - name: Build APK
        run: |
          gradle -p MamangAnter_Android_Starter assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: MAMANG-ANTER-APK
          path: MamangAnter_Android_Starter/app/build/outputs/apk/debug/app-debug.apk
