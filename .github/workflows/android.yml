name: Build MAMANG ANTER APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MAMANG_ANTER_XIAOMI_ANDROID13.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          accept-android-sdk-licenses: true
          packages: 'platform-tools, platforms;android-35, build-tools;35.0.0'
        with:
          cmdline-tools-version: 11076708
          accept-android-sdk-licenses: true
          packages: 'platform-tools, platforms;android-35, build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q MAMANG_ANTER_XIAOMI_ANDROID13.zip -d extracted

      - name: Find Android project
        run: |
          PROJECT_FILE=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "File settings.gradle tidak ditemukan"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: MAMANG-ANTER-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
